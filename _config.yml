title: Adonias Vitorio
url: "https://adoniasvitorio.github.io"
lang: pt-BR

google_analytics: G-MHDVWWGM96

sass:
  sass_dir: _sass
  style: compressed
  quiet_deps: true
  silence_deprecations: [import]


theme: minima
plugins:
  - jekyll-feed

minima:
  date_format: "%d/%m/%Y"
  social_links:
    - title: "GitHub"
      url: "https://github.com/adoniasvitorio"
      icon: "fab fa-github"
    - title: "LinkedIn"
      url: "https://www.linkedin.com/in/adoniasvitorio/"
      icon: "fab fa-linkedin"

# Notes collection for short snippets / gists
collections:
  notes:
    output: true
    permalink: /notes/:name/

defaults:
  - scope:
      path: ""
      type: notes
    values:
      layout: note