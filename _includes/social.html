<ul class="social-links">
  {%- if site.github_username -%}
  <li class="social-links__item">
    <a class="social-links__link" href="https://github.com/{{ site.github_username | cgi_escape | escape }}" aria-label="GitHub" title="GitHub">
      <svg class="social-links__icon" aria-hidden="true"><use xlink:href="{{ '/assets/minima-social-icons.svg#github' | relative_url }}"></use></svg>
    </a>
  </li>
  {%- endif -%}
  {%- if site.linkedin_username -%}
  <li class="social-links__item">
    <a class="social-links__link" href="https://www.linkedin.com/in/{{ site.linkedin_username | cgi_escape | escape }}" aria-label="LinkedIn" title="LinkedIn">
      <svg class="social-links__icon" aria-hidden="true"><use xlink:href="{{ '/assets/minima-social-icons.svg#linkedin' | relative_url }}"></use></svg>
    </a>
  </li>
  {%- endif -%}
</ul>
