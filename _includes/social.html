<ul class="social-list">
{%- for entry in site.minima.social_links -%}
  <li class="social-list__item">
    <a class="social-list__link" rel="me" href="{{ entry.url }}" target="_blank" title="{{ entry.title }}">
      <span class="social-list__icon grey fa-brands fa-{{ entry.icon }} fa-lg"></span>
      <span class="social-list__username">{{ entry.title }}</span>
    </a>
  </li>
{%- endfor -%}
</ul>
